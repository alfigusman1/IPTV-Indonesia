<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPTV Indonesia - Live TV Streaming</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark sticky-top">
      <div class="container-fluid">
        <a class="navbar-brand" href="#"><i class="bi bi-tv-fill"></i> IPTV Indonesia</a>
        <div class="d-flex align-items-center">
          <span class="badge bg-secondary me-2" id="statsBadge" title="Channel aktif">…</span>
          <button class="btn btn-outline-light" id="favoritesBtn">
            <i class="bi bi-heart-fill"></i>&nbsp;Favorit
          </button>
        </div>
      </div>
    </nav>

    <!-- Video Player -->
    <div class="container-fluid mt-3">
      <div class="row"><div class="col-12">
        <div class="player-wrapper" id="playerWrapper">
          <div class="player-placeholder" id="playerPlaceholder">
            <i class="bi bi-play-circle"></i>
            <p>Pilih channel untuk mulai streaming</p>
          </div>
          <video id="videoPlayer" controls playsinline preload="auto" style="display: none"></video>
          <div class="player-info" id="playerInfo" style="display: none">
            <h5 id="currentChannelName">-</h5>
            <span class="badge bg-success" id="statusBadge">LIVE</span>
          </div>
          <div class="loading-spinner" id="loadingSpinner" style="display: none">
            <div class="spinner-border text-light" role="status"><span class="visually-hidden">Loading...</span></div>
          </div>
        </div>
      </div></div>
    </div>

    <!-- Search & Filter -->
    <div class="container-fluid mt-4">
      <div class="row">
        <div class="col-md-6 mb-3">
          <div class="input-group">
            <span class="input-group-text bg-dark text-light border-dark"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control bg-dark text-light border-dark" id="searchInput" placeholder="Cari channel..." />
          </div>
        </div>
        <div class="col-md-3 mb-3">
          <select class="form-select bg-dark text-light border-dark" id="countryFilter"><option value="">Semua Negara</option></select>
        </div>
        <div class="col-md-3 mb-3">
          <select class="form-select bg-dark text-light border-dark" id="categoryFilter"><option value="">Semua Kategori</option></select>
        </div>
      </div>
    </div>

    <!-- Channels Grid -->
    <div class="container-fluid">
      <div class="row" id="channelsGrid"></div>
      <div id="gridEmpty" class="text-center text-secondary py-5" style="display:none">
        <i class="bi bi-inboxes" style="font-size:2rem"></i>
        <p class="mt-2">Tidak ada channel yang cocok.</p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="assets/js/player.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
